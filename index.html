if(l==0){k.fillStyle='#7a5530';k.beginPath();k.arc(r*.1,-r*.78,r*.14,0,7);k.fill()}

k.strokeStyle='#2a1810';k.lineWidth=Math.max(1.4,r*.06);
if(l==10){k.fillStyle='#ff6b81';k.beginPath();k.arc(0,r*.2,r*.17,0,Math.PI);k.fill();k.stroke()}
else{const m=l%4;k.beginPath();if(m==0)k.arc(0,r*.14,r*.14,.2,2.9);else if(m==1)k.arc(0,r*.28,r*.08,0,7);else if(m==2){k.moveTo(-r*.12,r*.28);k.lineTo(r*.12,r*.28)}else k.arc(0,r*.42,r*.13,3.4,6.0);k.stroke()}}
function dF(l,x,y,r,a=0,sx=1,sy=1){c.save();c.translate(x,y);c.rotate(a);c.scale(sx,sy);F(c,l,r);c.restore()}
/* ---------- STATE ---------- */
let combo=0,comboT=0,rg=[],bs0=0,aimV=480,al=1,fr=[],pt=[],fl=[],score=0,cur=0,nxt=0,aim=480,cool=0,clash=50,state='play',danger=0,sh=0,btns=[],ot=0,mx=0,my=0,lastHit=0;
const rnd=()=>Math.floor(Math.random()*4),mk=(l,x,y)=>({l,x,y,px:x,py:y,pa:0,sv:0,vx:0,vy:0,a:0,w:0,s:1,sq:0,age:0});
const setState=s=>{state=s;ot=0};
function reset(){fr=[];pt=[];fl=[];rg=[];combo=0;comboT=0;bs0=S.best;score=0;clash=50;cur=rnd();nxt=rnd();cool=0;danger=0;setState('play')}
reset();const resumed=loadProgress();state='load';let lp=0,fontsOk=false;try{document.fonts.load('30px "Lilita One"').then(()=>fontsOk=true,()=>fontsOk=true)}catch(e){fontsOk=true}setTimeout(()=>fontsOk=true,3000);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=80+Math.random()*220;pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:.7,col})}}

function act(id){sClick();

else if(id=='clash'){if(clash>0&&fr.length){clash--;sh=14;fr.forEach(f=>{f.vy-=450+Math.random()*350;f.vx+=(Math.random()-.5)*500;f.sq=.15});sClash()}}
else if(id=='bgm'){S.bgm=S.bgm?0:1;save();if(ac)nextT=ac.currentTime+.1;if(S.bgm)showTrack()}else if(id=='skip'){if(!S.bgm){S.bgm=1;save()}skipTrack()}else if(id=='snd'){S.snd=S.snd?0:1;save()}}
/* ---------- PHYSICS ---------- */
function step(dt){
for(const f of fr){f.px=f.x;f.py=f.y;f.pa=f.a;f.age+=dt;f.vy+=1500*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.999;f.a+=f.w*dt*.35;f.w*=.94;f.sq*=.9;f.sv+=(1-f.s)*900*dt;f.sv*=.94;f.s+=f.sv*dt}
const mg=[];
for(let it=0;it<4;it++){
for(let i=0;i<fr.length;i++){const a=fr[i];if(a.dead)continue;
for(let j=i+1;j<fr.length;j++){const b=fr[j];if(b.dead||a.dead)continue;
let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);const m=R[a.l]+R[b.l];

a.x-=nx*o*mb/t;a.y-=ny*o*mb/t;b.x+=nx*o*ma/t;b.y+=ny*o*ma/t;
const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
if(rv<0){const J=-1.1*rv/(1/ma+1/mb);a.vx-=J/ma*nx;a.vy-=J/ma*ny;b.vx+=J/mb*nx;b.vy+=J/mb*ny;
const tv=(b.vx-a.vx)*-ny+(b.vy-a.vy)*nx;a.vx+=-ny*tv*.03;a.vy+=nx*tv*.03;b.vx-=-ny*tv*.03;b.vy-=nx*tv*.03;a.w+=tv*.001;b.w+=tv*.001;
if(-rv>180&&performance.now()-lastHit>45){lastHit=performance.now();sHit(-rv);a.sq=b.sq=Math.min(.18,-rv/2500)}}}}}
for(const f of fr){if(f.dead)continue;const r=R[f.l];
for(const[x1,y1,x2,y2]of WL){const ex=x2-x1,ey=y2-y1;let t=cl(((f.x-x1)*ex+(f.y-y1)*ey)/(ex*ex+ey*ey),0,1);
const px=x1+ex*t,py=y1+ey*t,dx=f.x-px,dy=f.y-py,d=Math.hypot(dx,dy);

if(vn<0){f.vx-=1.15*vn*nx;f.vy-=1.15*vn*ny;f.vx*=.985;f.w+=f.vx*.00012;if(-vn>260&&performance.now()-lastHit>45){lastHit=performance.now();sHit(-vn);f.sq=Math.min(.15,-vn/3000)}}}}}}
for(const[a,b]of mg){const l=a.l+1,x=(a.x+b.x)/2,y=(a.y+b.y)/2,n=mk(l,x,y);n.vx=(a.vx+b.vx)/2;n.vy=(a.vy+b.vy)/2;n.s=.6;fr.push(n);
combo=comboT>0?combo+1:1;comboT=1.5;const gain=Math.round(PTS[l]*(1+Math.min(combo-1,8)*.25));score+=gain;if(score>S.best){S.best=score;save()}
fl.push({x,y,t:1,txt:'+'+gain});if(combo>1)fl.push({x,y:y-34,t:1,txt:'COMBO x'+combo});rg.push({x,y,r:R[l],t:1,col:COL[l]});burst(x,y,COL[l],12+l*2);sMerge(l,combo);if(l==10)sh=12;saveProgress()}

function T(s,x,y,sz,fill,st,al,sp){c.font=sz+'px "Lilita One","Arial Black",sans-serif';c.textAlign=al||'center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=sz/4;c.strokeStyle=st||'#fff';if('letterSpacing'in c)c.letterSpacing=(sp||0)+'px';c.strokeText(s,x,y);c.fillStyle=fill||'#2b2150';c.fillText(s,x,y);if('letterSpacing'in c)c.letterSpacing='0px'}
